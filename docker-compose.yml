services:
  db:
    image: postgres:17-alpine
    container_name: appointme-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appointme
      POSTGRES_PASSWORD: appointme_dev_password
      POSTGRES_DB: appointme
    ports:
      - "5433:5432"
    volumes:
      - appointme_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointme -d appointme"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  appointme_pgdata: